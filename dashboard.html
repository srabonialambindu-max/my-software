
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insurance Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 25px;
    }
    .container {
      max-width: 1100px;
      margin: auto;
    }
    h1 { color: #1e293b; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 4px 12px #0001;
    }
    button {
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Insurance Management Dashboard</h1>
    <div class="card">
      <h2>Customer Management</h2>
      <p>Add, search and update customers.</p>
    </div>
    <div class="card">
      <h2>Excel Bulk Upload</h2>
      <p>Import 200–300 customer records.</p>
    </div>
    <div class="card">
      <h2>Automatic QR Code</h2>
      <p>Generate a unique QR code for each policy.</p>
    </div>
    <div class="card">
      <h2>Insurance Certificates</h2>
      <p>Create downloadable policy certificates.</p>
    </div>
  </div>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance QR Software - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px #0002;
      width: 320px;
      max-width: 85%;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 5px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #23533F;
      color: white;
      border: none;
      cursor: pointer;
    }
    #message { font-size: 14px; margin-top: 15px; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Insurance QR Software</h2>
  <p>Super Admin Login</p>

  <form id="loginForm">
    <input type="email" id="email"
      placeholder="Email" required>
    <input type="password" id="password"
      placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <p id="message" role="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://ztllmicxyjmerkunkfgk.supabase.co";
const supabaseKey = "sb_publishable_1OxuYGPUeILy1ZYqiYo2gA_kplF6Scd";

const message = document.getElementById("message");

if (!window.supabase) {
  message.textContent = "Unable to load login service.";
} else {
  const db = window.supabase.createClient(
    supabaseUrl, supabaseKey
  );

  document.getElementById("loginForm")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      message.textContent = "Checking login...";

      try {
        const { data, error } =
          await db.auth.signInWithPassword({
            email, password
          });

        if (error || !data.user) {
          message.textContent =
            "Login failed: " + (error?.message || "Unknown error");
          return;
        }

        const { data: admin, error: adminError } = await db
          .from("admin_users")
          .select("user_id")
          .eq("user_id", data.user.id)
          .maybeSingle();

        if (adminError || !admin) {
          await db.auth.signOut();
          message.textContent =
            "Access denied. Super Admin permission required.";
          return;
        }

        message.textContent = "Login successful!";
        window.location.href = "dashboard.html";

      } catch (err) {
        message.textContent =
          "Connection error. Please try again.";
      }
    });
}
</script>
</body>
</html>
